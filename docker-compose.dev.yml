services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - path: .env.dev
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      POSTGRES_DB: ${POSTGRES_DB:-drop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-drop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drop_password}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    env_file:
      - path: .env.dev
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-drop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drop_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
