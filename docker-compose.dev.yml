services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - path: .env.dev
        required: false
    environment:
      DROP_API_BASE_URL: ${DROP_API_BASE_URL:-http://backend:8000/api}
      DROP_PUBLIC_BASE_URL: ${DROP_PUBLIC_BASE_URL:-http://localhost:3000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - path: .env.dev
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      POSTGRES_DB: ${POSTGRES_DB:-drop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-drop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drop_password}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    env_file:
      - path: .env.dev
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-drop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drop_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  frontend_node_modules:
  postgres_dev_data:
